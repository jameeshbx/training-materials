name: CI

on:
  push:
    branches: [ training-gokul ]
  pull_request:
    branches: [ training-gokul ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      - name: Run tests
        run: yarn test

      - name: Build application
        run: yarn build
