name: CI

# When should this run?
on:
  push:
    branches: [ anirva-training ]
  pull_request:
    branches: [ anirva-training ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install

      - name: Run tests
        run: yarn test

      - name: Build application
        run: yarn build
